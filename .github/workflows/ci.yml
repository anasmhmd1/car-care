name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bareeq
          POSTGRES_PASSWORD: bareeq_ci_password
          POSTGRES_DB: bareeq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bareeq -d bareeq_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bareeq:bareeq_ci_password@127.0.0.1:5432/bareeq_ci?schema=public
      DIRECT_URL: postgresql://bareeq:bareeq_ci_password@127.0.0.1:5432/bareeq_ci?schema=public
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      UPLOAD_DIR: ${{ github.workspace }}/data/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npx prisma migrate diff --from-url "$DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bareeq
          POSTGRES_PASSWORD: bareeq_ci_password
          POSTGRES_DB: bareeq_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bareeq -d bareeq_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bareeq:bareeq_ci_password@127.0.0.1:5432/bareeq_e2e?schema=public
      DIRECT_URL: postgresql://bareeq:bareeq_ci_password@127.0.0.1:5432/bareeq_e2e?schema=public
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      UPLOAD_DIR: ${{ github.workspace }}/data/uploads
      E2E_DATABASE_URL: postgresql://bareeq:bareeq_ci_password@127.0.0.1:5432/bareeq_e2e?schema=public
      SEED_PASSWORD: Ci-Demo-User-2026!Only
      SEED_ADMIN_PASSWORD: Ci-System-Admin-2026!Only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
