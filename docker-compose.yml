x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-carcare}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carcare_db}?schema=public
  DIRECT_URL: postgresql://${POSTGRES_USER:-carcare}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carcare_db}?schema=public
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
  BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-30}
  PAYMENT_REVIEW_HOLD_MINUTES: ${PAYMENT_REVIEW_HOLD_MINUTES:-1440}
  OPERATIONS_REVIEW_HOLD_MINUTES: ${OPERATIONS_REVIEW_HOLD_MINUTES:-1440}
  RESCHEDULE_HOLD_MINUTES: ${RESCHEDULE_HOLD_MINUTES:-1440}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
  STORAGE_DRIVER: local
  UPLOAD_DIR: /app/data/uploads
  NODE_ENV: production

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-carcare_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/data/uploads

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
