<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e2b3" />
      <stop offset="35%" stop-color="#dfb46c" />
      <stop offset="70%" stop-color="#cea355" />
      <stop offset="100%" stop-color="#9a712e" />
    </linearGradient>
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f5dfad" />
      <stop offset="70%" stop-color="#cea355" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Side: Stylized Double-C Automotive Gold Emblem -->
  <g transform="translate(40, 20)">
    <!-- Ambient Glow behind emblem -->
    <circle cx="120" cy="120" r="90" fill="#cea355" opacity="0.12" filter="url(#gold-glow)"/>

    <!-- Sports Car Silhouette Roofline -->
    <path d="M 30 145 C 55 125, 95 95, 140 95 C 185 95, 215 120, 235 140" 
          stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 235 140 C 248 150, 258 155, 265 158" 
          stroke="url(#gold-grad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 15 158 C 22 153, 30 148, 38 145" 
          stroke="url(#gold-grad)" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- First 'C' (Left Ring) -->
    <path d="M 125 50 C 75 50, 35 90, 35 140 C 35 190, 75 230, 125 230 C 158 230, 185 212, 198 185 L 175 172 C 165 190, 146 204, 125 204 C 90 204, 61 175, 61 140 C 61 105, 90 76, 125 76 C 146 76, 165 90, 175 108 L 198 95 C 185 68, 158 50, 125 50 Z" 
          fill="url(#gold-grad)"/>

    <!-- Second 'C' (Interlocking Right Ring) -->
    <path d="M 185 50 C 152 50, 125 68, 112 95 L 135 108 C 145 90, 164 76, 185 76 C 220 76, 249 105, 249 140 C 249 175, 220 204, 185 204 C 164 204, 145 190, 135 172 L 112 185 C 125 212, 152 230, 185 230 C 235 230, 275 190, 275 140 C 275 90, 235 50, 185 50 Z" 
          fill="url(#gold-grad)"/>

    <!-- Sparkle Stars -->
    <path d="M 185 35 L 188 47 L 200 50 L 188 53 L 185 65 L 182 53 L 170 50 L 182 47 Z" fill="#ffffff"/>
    <path d="M 270 135 L 272 142 L 279 144 L 272 146 L 270 153 L 268 146 L 261 144 L 268 142 Z" fill="#f5dfad"/>
  </g>

  <!-- Elegant Vertical Divider -->
  <line x1="365" y1="45" x2="365" y2="235" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>

  <!-- Brand Typography: CAR CARE (English) & كار كير (Arabic) -->
  <g transform="translate(410, 0)">
    <!-- English Primary Title: CAR CARE -->
    <text x="0" y="128" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Outfit', 'Montserrat', sans-serif" 
          font-size="88" 
          font-weight="900" 
          letter-spacing="9" 
          fill="url(#gold-grad)">
      CAR CARE
    </text>

    <!-- Arabic Sub-Title: كار كير -->
    <text x="590" y="126" 
          font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="1" 
          fill="#ffffff"
          opacity="0.95">
      كار كير
    </text>

    <!-- Tagline: LUXURY MOBILE AUTO CARE | العناية الفاخرة المتنقلة بالسيارات -->
    <text x="4" y="195" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="8" 
          fill="#e5e5e5" 
          opacity="0.85">
      LUXURY MOBILE AUTO CARE
    </text>

    <text x="600" y="193" 
          font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" 
          font-size="22" 
          font-weight="600" 
          fill="url(#gold-grad)" 
          opacity="0.9">
      العناية الفاخرة بالسيارات
    </text>
  </g>
</svg>
